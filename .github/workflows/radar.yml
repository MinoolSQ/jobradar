name: radar

on:
  schedule:
    # GitHub-ov scheduler ovaj posao pusta 4 do 6 sati posle zakazanog vremena (svih
    # dvanaest prvih pokretanja, zakazanih za 05:15, krenulo je izmedju 09:50 i 11:40).
    # Jedno jutarnje pokretanje zato ne vredi: rutina u 06:00 UTC bi uvek citala
    # jucerasnji fajl. Skuplja se cetiri puta dnevno, a sta je novo rutina vidi po
    # polju first_seen u svakom oglasu, ne po tome kad je fajl nastao.
    - cron: "23 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      dana:
        description: "Koliko dana unazad da skupi oglase"
        required: false
        default: "3"

permissions:
  contents: write

# Dva pokretanja istovremeno bi se sudarila na push-u.
concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  skupi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Skupi oglase
        run: python fetch_jobs.py --days "${{ inputs.dana || 3 }}" --out data/oglasi.json --debug-out data/debug.json

      - name: Arhiviraj dan
        run: |
          mkdir -p data/arhiva
          cp data/oglasi.json "data/arhiva/$(date -u +%Y-%m-%d).json"

      - name: Commituj
        run: |
          git config user.name "jobradar"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --staged --quiet && echo "nema promena" && exit 0
          git commit -m "oglasi $(date -u '+%Y-%m-%d %H:%M')"
          git push
