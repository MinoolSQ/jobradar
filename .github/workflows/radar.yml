name: radar

on:
  schedule:
    # 05:15 UTC je 07:15 po beogradskom vremenu dok traje letnje racunanje.
    # Rutina koja ovo cita krece u 06:00 UTC. Razmak je 45 minuta jer GitHub-ov
    # scheduler ume da kasni kad je guzva, nije garantovan na minut.
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      dana:
        description: "Koliko dana unazad da skupi oglase"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  skupi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Skupi oglase
        run: python fetch_jobs.py --days "${{ inputs.dana || 1 }}" --out data/oglasi.json

      - name: Arhiviraj dan
        run: |
          mkdir -p data/arhiva
          cp data/oglasi.json "data/arhiva/$(date -u +%Y-%m-%d).json"

      - name: Commituj
        run: |
          git config user.name "jobradar"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --staged --quiet && echo "nema promena" && exit 0
          git commit -m "oglasi $(date -u +%Y-%m-%d)"
          git push
