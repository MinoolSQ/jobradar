name: radar

on:
  schedule:
    # 05:45 UTC je 07:45 po beogradskom vremenu dok traje letnje racunanje.
    # Rutina koja ovo cita krece u 06:00 UTC, pa ima petnaest minuta zazora.
    - cron: "45 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skupi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skupi oglase
        run: python fetch_jobs.py --days 1 --out data/oglasi.json

      - name: Arhiviraj dan
        run: |
          mkdir -p data/arhiva
          cp data/oglasi.json "data/arhiva/$(date -u +%Y-%m-%d).json"

      - name: Commituj
        run: |
          git config user.name "jobradar"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --staged --quiet && echo "nema promena" && exit 0
          git commit -m "oglasi $(date -u +%Y-%m-%d)"
          git push
